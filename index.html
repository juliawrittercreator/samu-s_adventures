<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Coming Soon</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <section class="hero">
    <img src="hero.png" alt="App preview illustration" class="hero-image" id="heroImage" />

    <!-- Apple download badge -->
    <a href="#" class="apple-badge">
      <img src="apple-badge.svg" alt="Download on the App Store" />
    </a>

    <!-- Email signup -->
    <form class="waitlist">
      <input type="email" placeholder="Your email" required />
      <button type="submit">Join the waitlist</button>
    </form>
  </section>

  <!-- Big Picture Mode Overlay -->
  <div class="big-picture-overlay" id="bigPictureOverlay">
    <div class="big-picture-content">
      <img src="hero.png" alt="App preview illustration" class="big-picture-image" />
      <button class="big-picture-close" id="closeBigPicture" aria-label="Close big picture mode">&times;</button>
    </div>
  </div>

  <script>
    // Big Picture Mode functionality
    const heroImage = document.getElementById('heroImage');
    const bigPictureOverlay = document.getElementById('bigPictureOverlay');
    const closeBigPicture = document.getElementById('closeBigPicture');

    // Function to close big picture mode
    function closeBigPictureMode() {
      bigPictureOverlay.classList.remove('active');
      document.body.style.overflow = '';
    }

    // Open big picture mode when hero image is clicked
    heroImage.addEventListener('click', function() {
      bigPictureOverlay.classList.add('active');
      document.body.style.overflow = 'hidden'; // Prevent scrolling
    });

    // Close big picture mode when close button is clicked
    closeBigPicture.addEventListener('click', closeBigPictureMode);

    // Close big picture mode when clicking on the overlay background
    bigPictureOverlay.addEventListener('click', function(e) {
      if (e.target === bigPictureOverlay) {
        closeBigPictureMode();
      }
    });

    // Close big picture mode with ESC key
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && bigPictureOverlay.classList.contains('active')) {
        closeBigPictureMode();
      }
    });
  </script>

</body>
</html>
